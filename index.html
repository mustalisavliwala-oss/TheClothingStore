<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CLOTHING STORE | Cinematic Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --text: #f0f0f0;
            --gold: #d4af37;
            --font-heading: 'Cinzel', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            overflow-x: hidden;
            height: 300vh; /* Scroll space for cinematic camera journey */
        }

        /* Custom Luxury Cursor */
        .cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background 0.3s;
            z-index: 9999;
        }

        /* Canvas Wrapper for 3D Scene */
        #webgl-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* UI Overlays */
        .overlay-layer {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 60px;
            pointer-events: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            animation: fadeIn 1.5s ease 2.5s forwards;
        }

        .brand-title {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            letter-spacing: 4px;
            font-weight: 600;
        }

        .explore-hint {
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #888;
            animation: pulse 2s infinite;
        }

        /* Hero Content Sequence */
        .hero-content {
            position: absolute;
            bottom: 80px;
            left: 60px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease, transform 1s ease;
        }

        .hero-content.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .hero-content h1 {
            font-family: var(--font-heading);
            font-size: clamp(2.5rem, 4vw, 4.5rem);
            letter-spacing: 3px;
            margin-bottom: 15px;
            font-weight: 400;
        }

        .hero-content p {
            color: #999;
            max-width: 450px;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .cta-btn {
            background: transparent;
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 14px 36px;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
        }

        .cta-btn:hover {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="cursor" id="cursor"></div>
    <div id="webgl-container"></div>

    <div class="overlay-layer">
        <header>
            <div class="brand-title">T S C</div>
            <div class="explore-hint">Scroll to Explore Collection</div>
        </header>

        <div class="hero-content" id="heroText">
            <h1>THE CLOTHING STORE</h1>
            <p>Architectural streetwear engineered with meticulous precision and absolute exclusivity.</p>
            <button class="cta-btn" onclick="alert('Entering Private Vault...')">Acquire Pieces</button>
        </div>
    </div>

    {/* Load Three.js & GSAP via CDN for 3D Graphics and Cinematic Motion */}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        // Custom Smooth Cursor
        const cursor = document.getElementById('cursor');
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = `${e.clientX}px`;
            cursor.style.top = `${e.clientY}px`;
        });

        // --- Three.js Cinematic Scene Setup ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.05);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        // Cinematic Studio Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const keyLight = new THREE.SpotLight(0xffffff, 50);
        keyLight.position.set(5, 8, 5);
        scene.add(keyLight);

        const rimLight = new THREE.PointLight(0xd4af37, 20, 10);
        rimLight.position.set(-4, -2, -2);
        scene.add(rimLight);

        // --- Create High-End 3D Monogram (Simulating your T-S-C Logo in 3D) ---
        const group = new THREE.Group();
        
        // Material: Dark Brushed Metallic Obsidian
        const logoMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a1a,
            metalness: 0.95,
            roughness: 0.25,
            wireframe: false
        });

        // Central Pillar representing 'T'
        const tGeo = new THREE.BoxGeometry(0.8, 3.5, 0.3);
        const tMesh = new THREE.Mesh(tGeo, logoMaterial);
        tMesh.position.set(0, 0, 0);
        group.add(tMesh);

        // Top Bar of 'T'
        const tTopGeo = new THREE.BoxGeometry(3.2, 0.6, 0.3);
        const tTopMesh = new THREE.Mesh(tTopGeo, logoMaterial);
        tTopMesh.position.set(0, 1.6, 0);
        group.add(tTopMesh);

        // Curved structure simulation for 'C' and 'S'
        const ringGeo = new THREE.TorusGeometry(1.8, 0.22, 30, 100, Math.PI * 1.3);
        const ringMesh = new THREE.Mesh(ringGeo, logoMaterial);
        ringMesh.position.set(-0.2, -0.2, -0.2);
        ringMesh.rotation.z = Math.PI * 0.4;
        group.add(ringMesh);

        scene.add(group);

        // --- Cinematic Animation Sequence (The 100 Million Dollar Reveal) ---
        // Initial setup: Deep zoom out & rotated off-axis
        group.scale.set(0, 0, 0);
        group.rotation.x = -Math.PI;
        group.rotation.y = Math.PI * 2;

        // Sequence Timeline using GSAP
        const tl = gsap.timeline();

        // Step 1: Dramatic Materialization & Rotation Reveal
        tl.to(group.scale, { x: 1, y: 1, z: 1, duration: 2.2, ease: "power4.out", delay: 0.4 })
          .to(group.rotation, { x: 0.2, y: -0.4, z: 0, duration: 2.5, ease: "power3.out" }, "-=2.2")
          // Step 2: Camera slide down reveal
          .to(camera.position, { z: 7, duration: 2, ease: "power2.inOut" }, "-=1.8")
          // Step 3: Show UI text after logo settles
          .call(() => {
              document.getElementById('heroText').classList.add('visible');
          });

        // --- Interactive Mouse Parallax & Scroll Reaction ---
        let mouseX = 0;
        let mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 0.5;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 0.5;
        });

        // Scroll-based transformation
        window.addEventListener('scroll', () => {
            const scrollProgress = window.scrollY / (document.body.scrollHeight - window.innerHeight);
            group.rotation.y = -0.4 + (scrollProgress * Math.PI * 2);
            group.position.y = scrollProgress * 2;
        });

        // Render Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            // Subtle floating idle motion
            const elapsedTime = clock.getElapsedTime();
            if(scrollProgress === 0) {
                group.position.y = Math.sin(elapsedTime * 1.5) * 0.1;
            }

            // Smooth mouse parallax effect on group rotation
            group.rotation.y += (mouseX - group.rotation.y) * 0.05;
            group.rotation.x += (-mouseY - group.rotation.x) * 0.05;

            renderer.render(scene, camera);
        }
        animate();

        // Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
